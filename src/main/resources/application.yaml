spring:
  application:
    name: TroubleTicketApi

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trouble_ticket}
    username: ${POSTGRES_USER:ticket_user}
    password: ${POSTGRES_PASSWORD:local_dev_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db


logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: DEBUG
    org.springframework.orm.jpa: INFO
  pattern:
    level: "%5p [%X{X-Request-ID:-}]"
app:
  security:
    jwt-secret: ${JWT_SECRET:local-dev-secret-change-me-1234567890}